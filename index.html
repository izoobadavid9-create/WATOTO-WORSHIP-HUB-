<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watoto Worship Arts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#0B2A17;
  --stage-2:#123A21;
  --green:#25802D;
  --green-lift:#2E9A38;
  --sky:#8ED1FC;
  --paper:#EEF0EA;
  --card:#FFFFFF;
  --ink:#16201A;
  --ink-soft:#5E6B61;
  --ink-faint:#8D978F;
  --rule:#DDE1D8;
  --amber:#C47A14;
  --red:#B3261E;
  --violet:#6B4E9B;
  --radius:12px;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --text:'Instrument Sans',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1510; --card:#141E18; --ink:#E7EDE8; --ink-soft:#9FAEA4; --ink-faint:#74857A;
    --rule:#243029; --stage:#081A0F; --stage-2:#0E2817; --green-lift:#45B850;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1510; --card:#141E18; --ink:#E7EDE8; --ink-soft:#9FAEA4; --ink-faint:#74857A;
  --rule:#243029; --stage:#081A0F; --stage-2:#0E2817; --green-lift:#45B850;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--text);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green-lift);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- STAGE (hero) ---------- */
.stage{
  background:
    radial-gradient(120% 90% at 82% -10%, rgba(142,209,252,.18), transparent 62%),
    linear-gradient(176deg,var(--stage) 0%,var(--stage-2) 100%);
  color:#F2F7F3;padding:0 0 26px;
}
.stage-in{max-width:1080px;margin:0 auto;padding:0 22px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 26px}
.mark{display:flex;align-items:center;gap:11px;font-family:var(--display);letter-spacing:-.02em}
.mark .logo{
  width:40px;height:40px;border-radius:10px;display:block;
  box-shadow:0 0 0 1px rgba(255,255,255,.14);
}
.mark span{
  font-size:18px;font-weight:500;color:rgba(242,247,243,.9);
  padding-left:11px;border-left:1px solid rgba(255,255,255,.22);line-height:1.1;
}
.bar-right{display:flex;align-items:center;gap:8px}
#adminBtn{text-decoration:none;display:inline-flex;align-items:center}
.month{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#F2F7F3;
  padding:7px 12px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;
}
.month option{color:#16201A}
.ghost{
  background:transparent;border:1px solid rgba(255,255,255,.2);color:#F2F7F3;
  width:36px;height:36px;border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:15px;
}
.ghost:hover,.month:hover{background:rgba(255,255,255,.17)}

.headline{
  font-family:var(--display);font-weight:600;letter-spacing:-.035em;
  font-size:clamp(30px,6.4vw,54px);line-height:1.04;margin:0;max-width:17ch;
}
.headline em{font-style:normal;color:var(--sky)}
.sub{margin:14px 0 0;max-width:46ch;color:rgba(242,247,243,.68);font-size:15px}

/* the roll-call ribbon: one tick per campus */
.ribbon{display:flex;gap:4px;margin-top:26px;height:34px;align-items:flex-end}
.tick{
  flex:1;border-radius:3px;background:rgba(255,255,255,.14);
  transform-origin:bottom;transform:scaleY(.42);
  transition:transform .5s cubic-bezier(.2,.8,.3,1),background .3s;
}
.tick.in{background:var(--sky);transform:scaleY(1)}
.ribbon.ready .tick{transition-delay:calc(var(--i) * 42ms)}
.ribbon-key{
  display:flex;gap:18px;margin-top:11px;font-size:12.5px;color:rgba(242,247,243,.6);
}
.ribbon-key i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.ribbon-key b{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- RACK ---------- */
.rack{max-width:1080px;margin:0 auto;padding:30px 22px 70px}
.rack-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.rack-title{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.025em;margin:0}
.rack-note{color:var(--ink-soft);font-size:13.5px;margin:0}

/* ---------- REGION TILES ---------- */
.regions{
  display:grid;gap:11px;margin-top:18px;align-items:start;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}
.rtile{
  position:relative;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--radius);overflow:hidden;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.rtile::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c);
  opacity:.5;transition:opacity .18s ease;z-index:1;
}
.rtile:hover{box-shadow:0 4px 14px rgba(11,42,23,.07)}
.rtile.on{grid-column:1 / -1;border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.rtile.on::before{opacity:1}

.rt-head{
  width:100%;background:none;border:0;font:inherit;color:inherit;cursor:pointer;
  text-align:left;display:block;padding:14px;
}
.rt-title{display:flex;align-items:center;gap:8px}
.rt-name{
  font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:-.02em;
  flex:1;min-width:0;
}
.rt-chev{color:var(--ink-faint);font-size:13px;transition:transform .22s ease;flex:none}
.rtile.on .rt-chev{transform:rotate(90deg);color:var(--c)}

.rt-num{
  font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:-.04em;
  line-height:1;margin-top:11px;display:block;
}
.rt-cap{font-size:12.5px;color:var(--ink-soft);margin-top:4px;display:block}
.rt-ticks{display:flex;gap:3px;margin-top:12px}
.rt-ticks i{flex:1;height:5px;border-radius:2px;background:var(--rule);display:block;min-width:7px}
.rt-ticks i.in{background:var(--c)}
.rt-foot{font-size:12px;color:var(--ink-faint);margin-top:7px;display:block}

/* open: the summary folds into one horizontal strip so the campuses get the room */
.rt-open{display:none}
.rtile.on .rt-closed{display:none}
.rtile.on .rt-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px}
.rtile.on .rt-title{flex:1 1 150px}
.rtile.on .rt-open{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px}
.rtile.on .rt-sum{font-size:13.5px;color:var(--ink-soft)}
.rtile.on .rt-ticks{margin-top:0;width:96px;flex:none}
.rtile.on .rt-foot{margin-top:0}

.rt-body{display:none;border-top:1px solid var(--rule);padding:12px 12px 6px;background:var(--paper-soft,transparent)}
.rtile.on .rt-body{display:block}

.rolegrp{margin-top:14px}
.rolegrp:first-of-type{margin-top:8px}
.rolegrp h5{
  margin:0 0 7px;font-family:var(--display);font-weight:600;font-size:12.5px;
  letter-spacing:.01em;color:var(--ink-soft);
}
.empty-note{
  margin:26px 0 0;padding:26px 18px;text-align:center;border:1px dashed var(--rule);
  border-radius:var(--radius);color:var(--ink-soft);font-size:14px;
}

.group{margin-top:26px}
.group-label{
  display:flex;align-items:center;gap:11px;margin-bottom:9px;
}
.group-label h3{
  font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:-.01em;margin:0;color:var(--ink-soft);
}
.group-label .line{flex:1;height:1px;background:var(--rule)}
.group-label .n{font-size:12.5px;color:var(--ink-faint)}

.channel{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  margin-bottom:7px;overflow:hidden;
}
.channel.open{border-color:var(--green);box-shadow:0 1px 0 var(--green) inset,0 0 0 1px var(--green)}
.ch-btn{
  width:100%;background:none;border:0;cursor:pointer;text-align:left;
  display:grid;grid-template-columns:5px 1fr auto;align-items:center;gap:0;
  padding:0;
}
.ch-accent{align-self:stretch;min-height:66px;border-radius:3px 0 0 3px}
.ch-main{padding:13px 4px 13px 15px;min-width:0}
.ch-name{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.ch-meta{font-size:13px;color:var(--ink-soft);margin-top:2px}
.ch-right{display:flex;align-items:center;gap:16px;padding:13px 15px 13px 10px}

.fader{width:132px}
.fader-track{height:7px;border-radius:4px;background:var(--rule);display:flex;overflow:hidden}
.fader-track i{display:block;height:100%}
.fader-cap{font-size:12px;color:var(--ink-soft);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chev{color:var(--ink-faint);transition:transform .22s ease;font-size:13px}
.channel.open .chev{transform:rotate(90deg)}

.pill{
  font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;
}
.pill.live{background:rgba(37,128,45,.13);color:var(--green)}
.pill.due{background:rgba(196,122,20,.14);color:var(--amber)}
.pill.draft{background:rgba(107,78,155,.14);color:var(--violet)}

/* ---------- PANEL ---------- */
.panel{display:none;border-top:1px solid var(--rule);padding:18px 15px}
.channel.open .panel{display:block}
.block{margin-bottom:24px}
.block > h4{
  font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:-.015em;margin:0 0 3px;
}
.block > p.hint{margin:0 0 12px;font-size:13px;color:var(--ink-soft)}

.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:720px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}

label.f{display:block}
label.f > span{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:4px}
input[type=number],input[type=text],input[type=date],select,textarea{
  width:100%;background:var(--card);border:1px solid var(--rule);border-radius:9px;
  padding:9px 11px;font-size:14.5px;
}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px rgba(37,128,45,.13)}
input[type=number]{-moz-appearance:textfield}

.drop{
  border:1.5px dashed var(--rule);border-radius:11px;padding:22px 16px;text-align:center;
  cursor:pointer;background:var(--card);transition:border-color .15s,background .15s;
  display:grid;gap:3px;
}
.drop strong{font-size:14.5px;font-weight:600}
.drop span{font-size:13px;color:var(--ink-soft)}
.drop:hover{border-color:var(--green)}
.drop.over{border-color:var(--green);background:rgba(37,128,45,.07)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:12px}
.shots:empty{display:none}
.shot{margin:0;position:relative}
.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;display:block;background:var(--paper)}
.shot .x{
  position:absolute;top:6px;right:6px;width:25px;height:25px;border-radius:50%;border:0;
  background:rgba(11,42,23,.74);color:#fff;cursor:pointer;font-size:15px;line-height:1;
}
.shot .x:hover{background:var(--red)}
.shot input{margin-top:6px;font-size:13px;padding:6px 9px}
.note{font-size:12.5px;color:var(--ink-soft);margin:9px 0 0;min-height:1em}
.note.warn{color:var(--amber)}

.actions{display:flex;gap:9px;flex-wrap:wrap;padding-top:4px}
.btn{border:0;border-radius:9px;padding:10px 17px;font-size:14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-lift)}
.btn.quiet{background:transparent;border:1px solid var(--rule);color:var(--ink)}
.btn.quiet:hover{border-color:var(--ink-soft)}
.saved{font-size:13px;color:var(--green);align-self:center;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}

.cloud{display:inline-block;margin-left:6px;opacity:.8}
.cloud.ok{color:var(--green-lift)}
.cloud.warn{color:var(--amber)}
.foot{
  max-width:1080px;margin:0 auto;padding:0 22px 46px;color:var(--ink-faint);font-size:12.5px;
}

@media (max-width:640px){
  .regions{grid-template-columns:repeat(2,1fr);gap:9px}
  .rtile.on .rt-ticks{width:72px}
  .rt-body{padding:10px 8px 4px}
  .rt-num{font-size:25px;padding-top:9px}
  .rt-name{font-size:14.5px}
  .rt-top,.rt-num,.rt-cap,.rt-ticks,.rt-foot{padding-left:12px;padding-right:12px}
  .mark .logo{width:34px;height:34px}
  .mark span{font-size:15.5px;padding-left:9px}
  .bar{gap:10px}
  .ch-right{gap:11px;padding-right:12px}
  .fader{width:84px}
  .fader-cap{font-size:11px}
  .ch-name{font-size:16px}
  .g2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="stage">
  <div class="stage-in">
    <div class="bar">
      <div class="mark">
        <img class="logo" src="watoto-logo.jpg" alt="Watoto">
        <span>Worship Arts</span>
      </div>
      <div class="bar-right">
        <select class="month" id="month" aria-label="Reporting month"></select>
        <a class="month" id="adminBtn" href="admin.html">Admin</a>
        <button class="ghost" id="themeBtn" aria-label="Switch between light and dark">◐</button>
      </div>
    </div>

    <h1 class="headline" id="headline">Every campus, <em>on one board.</em></h1>
    <p class="sub" id="sub">Loading…</p>

    <div class="ribbon" id="ribbon" aria-hidden="true"></div>
    <div class="ribbon-key">
      <i><b style="background:var(--sky)"></b> Reported</i>
      <i><b style="background:rgba(255,255,255,.22)"></b> Still to come</i>
    </div>
  </div>
</header>

<main class="rack">
  <div class="rack-head">
    <h2 class="rack-title">All campuses</h2>
    <p class="rack-note">Choose a region to see its campuses. Tap a campus to open its report.</p>
  </div>
  <div class="regions" id="regions"></div>
</main>

<p class="foot">Watoto Church · Worship &amp; Creative Arts. Monthly ministry reporting.
  <span id="cloud" class="cloud">Connecting to the shared record…</span></p>

<script>
/* ---------------- data ---------------- */
const REGIONS = [
  {id:'central',  name:'Central',             color:'#25802D', campuses:['Bugolobi','Downtown','Kansanga']},
  {id:'northern', name:'Northern',            color:'#2F6FA8', campuses:['Ntinda','Nakweru']},
  {id:'eastern',  name:'Eastern',             color:'#8A6A1C', campuses:['Bweyogerere','Mukono']},
  {id:'western',  name:'Western',             color:'#A2452A', campuses:['Kyengera','Nansana']},
  {id:'southern', name:'Southern',            color:'#6B4E9B', campuses:['Lubowa','Entebbe']},
  {id:'beyond',   name:'Beyond Kampala',      color:'#1F7A6E', campuses:['Jinja','Mbarara','Gulu','Juba']},
  {id:'villages', name:'Watoto Villages',     color:'#B06A2C', campuses:['Suubi','Bbira','Laminadera']}
];
const ALL = REGIONS.flatMap(r => r.campuses.map(c => ({campus:c, region:r})));

const ROLE_GROUPS = [
  {g:'Adult church',       items:['Singers','Choir members','Choir attendance','Instrumentalists']},
  {g:'Morph',              items:['Singers','Instrumentalists']},
  {g:"Children's church",  items:['Singers','Instrumentalists']}
];
/* creative arts stand on their own, campus-wide, not split by congregation */
const CREATIVES = ['Dancers','Actors','Spoken word','Other creatives'];
const ROLES = ROLE_GROUPS.flatMap(x => x.items.map(i => x.g + ': ' + i))
  .concat(CREATIVES.map(i => 'Creatives: ' + i));
/* attendance figures describe turnout, not extra people - excluded from headcount totals */
const ATTENDANCE_KEYS = ['Adult church: Choir attendance'];
const COUNT_ROLES = ROLES.filter(r => !ATTENDANCE_KEYS.includes(r));
const SERVICES = ['Sunday services','Evenings of prayer','Weddings','Funerals'];
const MONTHS = (() => {
  const out=[], now=new Date();
  for(let i=0;i<8;i++){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push({k:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,
              label:d.toLocaleString('en',{month:'long',year:'numeric'})});
  }
  return out;
})();

/* ---------------- storage ---------------- */
const KEY='watoto-worship-arts-v1';
let DB = {reports:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) DB = Object.assign(DB, JSON.parse(raw)); }catch(e){}
function save(campus){
  if(typeof cloudPush === 'function') cloudPush(campus || open);
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch(e){ return false; }
}

/* ---------------- shared record (Supabase) ---------------- */
const SB_URL = 'https://vjjpwylxulcqksycdnnb.supabase.co';
const SB_KEY = 'sb_publishable_tFfmkmgCnqAE8qes3EIgMg_GBlh-Bfy';
const SB_H = {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'};
const REST = SB_URL + '/rest/v1/reports';

function cloudSay(msg, cls){
  const el = document.getElementById('cloud');
  if(el){ el.textContent = msg; el.className = 'cloud ' + (cls||''); }
}

async function cloudLoad(){
  try{
    const res = await fetch(REST + '?select=campus,month,status,services,roles,text,photos', {headers: SB_H});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    rows.forEach(r => {
      DB.reports[r.campus + '|' + r.month] = {
        status: r.status || 'draft',
        services: r.services || {}, roles: r.roles || {},
        text: r.text || {}, photos: r.photos || []
      };
    });
    save();
    cloudSay('Shared record connected · ' + rows.length + ' report' + (rows.length===1?'':'s') + ' loaded', 'ok');
    render();
  }catch(e){
    cloudSay('Working offline — saved on this device only', 'warn');
  }
}

const pending = new Set();
let pushTimer = null;
function cloudPush(campus){
  if(!campus) return;
  pending.add(campus + '|' + month);
  clearTimeout(pushTimer);
  pushTimer = setTimeout(flushCloud, 900);
}
async function flushCloud(){
  const keys = [...pending]; pending.clear();
  if(!keys.length) return;
  const body = keys.map(k => {
    const [campus, m] = k.split('|');
    const r = DB.reports[k] || {};
    return {campus, month: m, status: r.status || 'draft',
      services: r.services || {}, roles: r.roles || {},
      text: r.text || {}, photos: r.photos || []};
  });
  cloudSay('Saving to the shared record…');
  try{
    const res = await fetch(REST, {method:'POST',
      headers: Object.assign({Prefer: 'resolution=merge-duplicates,return=minimal'}, SB_H),
      body: JSON.stringify(body)});
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0,120));
    cloudSay('Saved to the shared record', 'ok');
  }catch(e){
    keys.forEach(k => pending.add(k));
    cloudSay('Could not reach the shared record — kept on this device', 'warn');
  }
}

function reportOf(campus, month){
  const k = campus+'|'+month;
  if(!DB.reports[k]) DB.reports[k] = {status:'none', services:{}, roles:{}, text:{}, photos:[]};
  if(!DB.reports[k].photos) DB.reports[k].photos = [];
  return DB.reports[k];
}
function gatherings(campus, month){
  const rep = reportOf(campus, month);
  return SERVICES.reduce((s,k) => s + (+rep.services[k]||0), 0);
}
function serving(campus, month){
  const rep = reportOf(campus, month);
  return COUNT_ROLES.reduce((s,k) => s + (+rep.roles[k]||0), 0);
}

/* ---------------- state ---------------- */
let month = MONTHS[0].k;
let open = null;

/* ---------------- header ---------------- */
const monthSel = document.getElementById('month');
monthSel.innerHTML = MONTHS.map(m => `<option value="${m.k}">${m.label}</option>`).join('');
monthSel.value = month;
monthSel.addEventListener('change', () => { month = monthSel.value; open = null; render(); });

document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});

function renderStage(){
  const done = ALL.filter(c => reportOf(c.campus, month).status === 'submitted').length;
  const people = ALL.reduce((s,c) => s + serving(c.campus, month), 0);
  const gaths = ALL.reduce((s,c) => s + gatherings(c.campus, month), 0);

  document.getElementById('headline').innerHTML = done === ALL.length
    ? `All ${ALL.length} campuses have <em>reported.</em>`
    : `${done} of ${ALL.length} campuses have <em>reported.</em>`;

  document.getElementById('sub').textContent = people
    ? `${people} people served across ${gaths} gathering${gaths===1?'':'s'} so far this month.`
    : `Nothing counted yet this month. Open a campus to start its report.`;

  const ribbon = document.getElementById('ribbon');
  ribbon.innerHTML = ALL.map((c,i) =>
    `<span class="tick ${reportOf(c.campus,month).status==='submitted'?'in':''}" style="--i:${i}" title="${c.campus}"></span>`
  ).join('');
  requestAnimationFrame(() => ribbon.classList.add('ready'));
}

/* ---------------- regions ---------------- */
const RKEY = KEY + ':regions';
let openRegions = (() => {
  try{
    const raw = localStorage.getItem(RKEY);
    if(raw) return new Set(JSON.parse(raw));
  }catch(e){}
  return new Set([REGIONS[0].id]);   // first visit: open one so the board isn't bare
})();
function saveRegions(){
  try{ localStorage.setItem(RKEY, JSON.stringify([...openRegions])); }catch(e){}
}

function regionStats(r){
  const done   = r.campuses.filter(c => reportOf(c, month).status === 'submitted').length;
  const people = r.campuses.reduce((s,c) => s + serving(c, month), 0);
  const gaths  = r.campuses.reduce((s,c) => s + gatherings(c, month), 0);
  return {done, people, gaths, total:r.campuses.length};
}

function renderRegions(){
  const host = document.getElementById('regions');

  host.innerHTML = REGIONS.map(r => {
    const st = regionStats(r), on = openRegions.has(r.id);
    const ticks = `<span class="rt-ticks">` + r.campuses.map(c =>
      `<i class="${reportOf(c,month).status==='submitted'?'in':''}" title="${c}"></i>`).join('') + `</span>`;
    const foot = `<span class="rt-foot">${st.done} of ${st.total} reported</span>`;
    const sum  = st.people
        ? `${st.people} serving · ${st.gaths} gathering${st.gaths===1?'':'s'}`
        : 'Nothing counted yet';

    return `
    <section class="rtile ${on?'on':''}" style="--c:${r.color}">
      <button class="rt-head" data-region="${r.id}" aria-expanded="${on}">
        <span class="rt-title">
          <span class="rt-name">${r.name}</span>
          <span class="rt-chev">&rsaquo;</span>
        </span>
        <span class="rt-closed">
          <span class="rt-num">${st.people || '—'}</span>
          <span class="rt-cap">${st.people
              ? `serving · ${st.gaths} gathering${st.gaths===1?'':'s'}`
              : 'nothing counted yet'}</span>
          ${ticks}${foot}
        </span>
        <span class="rt-open">
          <span class="rt-sum">${sum}</span>
          ${ticks}${foot}
        </span>
      </button>
      <div class="rt-body">
        ${on ? r.campuses.map(c => channel(c, r)).join('') : ''}
      </div>
    </section>`;
  }).join('');

  host.querySelectorAll('.rt-head').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.region;
    if(openRegions.has(id)){
      openRegions.delete(id);
      const r = REGIONS.find(x => x.id === id);
      if(r && r.campuses.includes(open)) open = null;   // don't hide an open form
    } else {
      openRegions.add(id);
    }
    saveRegions();
    render();
  }));

  host.querySelectorAll('.ch-btn').forEach(b => b.addEventListener('click', () => {
    open = (open === b.dataset.campus) ? null : b.dataset.campus;
    render();
    if(open){
      const el = document.querySelector('.channel.open');
      if(el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    }
  }));

  wire();
}

function channel(c, r){
  const rep = reportOf(c, month), n = serving(c, month), g = gatherings(c, month);
  const peak = Math.max(1, ...ALL.map(x => serving(x.campus, month)));
  const pill = rep.status==='submitted' ? `<span class="pill live">Reported</span>`
             : rep.status==='draft'     ? `<span class="pill draft">Draft</span>`
                                        : `<span class="pill due">Not yet in</span>`;
  const meta = n
      ? `${n} serving · ${g} gathering${g===1?'':'s'}`
      : (rep.status==='draft' ? `Started, not finished` : `Nothing counted yet`);

  return `
  <article class="channel ${open===c?'open':''}">
    <button class="ch-btn" data-campus="${c}" aria-expanded="${open===c}">
      <span class="ch-accent" style="background:${r.color}"></span>
      <span class="ch-main">
        <span class="ch-name">${c} <span class="chev">›</span></span>
        <span class="ch-meta">${meta}</span>
      </span>
      <span class="ch-right">
        <span class="fader">
          <span class="fader-track">
            <i style="width:${n/peak*100}%;background:${r.color}"></i>
          </span>
          <span class="fader-cap"><span>${n ? n+' serving' : '—'}</span></span>
        </span>
        ${pill}
      </span>
    </button>
    ${open===c ? panel(c) : ''}
  </article>`;
}

/* ---------------- panel ---------------- */
function panel(c){
  return `<div class="panel">${reportSheet(c)}</div>`;
}

function reportSheet(c){
  const rep = reportOf(c, month);
  const num = (k,label,group) =>
    `<label class="f"><span>${label}</span><input type="number" min="0" placeholder="0"
      value="${rep[group][k] ?? ''}" data-rep="${group}" data-key="${k}"></label>`;
  const area = (k,label,hint) =>
    `<label class="f"><span>${label}</span><textarea placeholder="${hint}" data-rep="text" data-key="${k}">${rep.text[k] ?? ''}</textarea></label>`;

  return `
  <div class="block">
    <h4>Number of services and events held</h4>
    <p class="hint">How many of each did ${c} hold this month? If there weren’t any of something, a zero is perfectly fine.</p>
    <div class="grid g4">${SERVICES.map(s => num(s,s,'services')).join('')}</div>
  </div>

  <div class="block">
    <h4>People actively serving</h4>
    <p class="hint">How many people are actively serving this month? Count the people who call this campus home —
       the ones whose cell is here — even if they served at another campus this month. If a team rotated in to help
       you, leave them out; their own campus will count them. Think of everyone who’s part of the team right now,
       not just last Sunday’s line-up, and leave a zero if there’s no one in a spot. For choir, there are two boxes:
       how many are on the choir, and how many usually turn up on a Sunday.</p>
    ${ROLE_GROUPS.map(x => `
      <div class="rolegrp">
        <h5>${x.g}</h5>
        <div class="grid g4">${x.items.map(i => num(x.g+': '+i, i, 'roles')).join('')}</div>
      </div>`).join('')}
  </div>

  <div class="block">
    <h4>Creatives</h4>
    <p class="hint">How many serve in the creative arts? Your dancers, drama folk and spoken word —
       count each person once. If a group hasn’t started yet, just leave a zero, that’s okay.</p>
    <div class="grid g4">${CREATIVES.map(i => num('Creatives: '+i, i, 'roles')).join('')}</div>
  </div>

  <div class="block">
    <h4>Training and leadership development</h4>
    <p class="hint">Who is growing on the team this month? How many are enrolled in CMF,
       who you are walking with, and what stage they have reached.</p>
    ${area('cmf','','Example: four on the CMF foundation module, two being trained on the sound desk.')}
  </div>

  <div class="block">
    <h4>Impact story</h4>
    <p class="hint">Whose life was touched this month? Tell us about one person — who they are,
       what happened, and where they are now. We’d love to hear it.</p>
    ${area('story','','Example: a team member who joined as a volunteer and is now leading a Sunday set.')}
  </div>

  <div class="block">
    <h4>Highlights and challenges</h4>
    <p class="hint">What went well this month, and what got in the way? The more specific you can be,
       the easier it is for us to come alongside you.</p>
    <div class="grid g2">
      ${area('well','Highlights','What worked this month, and why.')}
      ${area('hard','Challenges','What failed or was missing, and what it would take to fix it.')}
    </div>
  </div>

  <div class="block">
    <h4>Pressing needs</h4>
    <p class="hint">What does the team need next month? Just jot them down, one per line —
       no need to explain, you’ve already said it above. For example: choir monitors · drum kit service due · guitar strings.</p>
    ${area('needs','','Choir monitors\nGear service due\nGuitar strings')}
  </div>

  <div class="block">
    <h4>Focus areas for next month</h4>
    <p class="hint">What is the team setting its heart on next month? Pop in the dates that matter,
       so nobody misses them.</p>
    ${area('next','','Example: rehearsals for the Christmas production begin 14 November.')}
  </div>

  <div class="block">
    <h4>Photos</h4>
    <p class="hint">Any photos from this month? Drag them onto the box below, or tap it to pick some from your phone —
       up to six. They bring the report to life.</p>
    <div class="drop" data-drop tabindex="0" role="button" aria-label="Add photos">
      <strong>Drop photos here</strong>
      <span>or tap to choose files &middot; JPG or PNG</span>
    </div>
    <input type="file" accept="image/*" multiple hidden data-filein>
    <div class="shots" data-shots>${(rep.photos||[]).map((p,i) => `
      <figure class="shot">
        <img src="${p.src}" alt="${p.caption || 'Report photo'}">
        <button class="x" data-rmphoto="${i}" aria-label="Remove photo">&times;</button>
        <input type="text" placeholder="Caption (optional)" value="${(p.caption||'').replace(/"/g,'&quot;')}" data-cap="${i}">
      </figure>`).join('')}</div>
    <p class="note" data-shotnote></p>
  </div>

  <div class="block">
    <h4>Video link</h4>
    <p class="hint">Is there a video we should see? Videos are a bit too big to keep here, so pop it on
       Drive or YouTube and paste the link below.</p>
    ${area('video','','https://')}
  </div>

  <div class="actions">
    <button class="btn primary" data-act="submit" data-campus="${c}">Submit report</button>
    <button class="btn quiet" data-act="draft" data-campus="${c}">Save as draft</button>
    <span class="saved" data-saved>Saved</span>
  </div>`;
}

/* ---------------- wiring ---------------- */
function flash(scope){
  const el = scope.querySelector('[data-saved]');
  if(!el) return;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1600);
}

function wire(){
  document.querySelectorAll('[data-rep]').forEach(i => i.addEventListener('input', () => {
    const rep = reportOf(open, month);
    rep[i.dataset.rep][i.dataset.key] = i.type === 'number' ? (i.value === '' ? '' : +i.value) : i.value;
    if(rep.status === 'none') rep.status = 'draft';
    save();
  }));

  const drop = document.querySelector('[data-drop]');
  const filein = document.querySelector('[data-filein]');
  if(drop && filein){
    const campus = open;
    drop.addEventListener('click', () => filein.click());
    drop.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); filein.click(); }
    });
    filein.addEventListener('change', () => { if(filein.files.length) addPhotos(campus, filein.files); });
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
      e.preventDefault(); drop.classList.add('over');
    }));
    ['dragleave','dragend'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('over');
      if(e.dataTransfer.files.length) addPhotos(campus, e.dataTransfer.files);
    });
  }

  document.querySelectorAll('[data-rmphoto]').forEach(b => b.addEventListener('click', () => {
    reportOf(open, month).photos.splice(+b.dataset.rmphoto, 1);
    save(); render();
  }));

  document.querySelectorAll('[data-cap]').forEach(i => i.addEventListener('input', () => {
    reportOf(open, month).photos[+i.dataset.cap].caption = i.value;
    save();
  }));

  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const c = b.dataset.campus, act = b.dataset.act;
    reportOf(c, month).status = act === 'submit' ? 'submitted' : 'draft';
    save(c); render();
    const p = document.querySelector('.channel.open .panel'); if(p) flash(p);
  }));
}


/* ---------------- photos ---------------- */
const MAX_PHOTOS = 6;

function shrink(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode'));
      img.onload = () => {
        const cap = 1280;
        const scale = Math.min(1, cap / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addPhotos(campus, fileList){
  const rep = reportOf(campus, month);
  const note = document.querySelector('[data-shotnote]');
  const files = [...fileList].filter(f => f.type.startsWith('image/'));
  const skipped = fileList.length - files.length;

  if(!files.length){
    if(note){ note.textContent = 'Those files are not images. Photos must be JPG or PNG.'; note.className = 'note warn'; }
    return;
  }
  const room = MAX_PHOTOS - rep.photos.length;
  if(room <= 0){
    if(note){ note.textContent = `This report already has ${MAX_PHOTOS} photos. Remove one to add another.`; note.className = 'note warn'; }
    return;
  }
  if(note){ note.textContent = 'Adding photos…'; note.className = 'note'; }

  const take = files.slice(0, room);
  const before = rep.photos.length;
  for(const f of take){
    try{ rep.photos.push({src: await shrink(f), caption: ''}); }
    catch(e){ /* skip files that will not decode */ }
  }
  if(rep.status === 'none') rep.status = 'draft';

  if(!save()){
    rep.photos.length = before;
    save();
    render();
    const n2 = document.querySelector('[data-shotnote]');
    if(n2){ n2.textContent = 'There is no room left in this browser to store more photos. Export the reports, then clear older ones.'; n2.className = 'note warn'; }
    return;
  }
  render();
  const n3 = document.querySelector('[data-shotnote]');
  if(n3 && (files.length > room || skipped)){
    n3.textContent = `Added ${take.length}. ${files.length > room ? `Only ${MAX_PHOTOS} photos are kept per report.` : ''} ${skipped ? skipped + ' non-image file skipped.' : ''}`.trim();
    n3.className = 'note warn';
  }
}

function render(){ renderStage(); renderRegions(); }
render();
cloudLoad();
</script>
